## Bypasses the cluster lookup failure in Fleet GitOps pipelines
#controllerServiceAccount:
#  name: gha-rs-controller
#  namespace: arc-systems # Ensure this matches where your ARC manager/controller is installed

githubConfigUrl: "https://github.com/mrolmedo/bundle"

githubConfigSecret: "arc-runner-predefined-secret"

runnerScaleSetName: "arc-runner-set"
minRunners: 1
maxRunners: 5

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: tcp://localhost:2375
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work

      - name: dind
        image: docker:dind
        securityContext:
          privileged: true
        env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
        args:
          - dockerd
          - --host=tcp://localhost:2375
        volumeMounts:
          - name: dind-storage
            mountPath: /var/lib/docker
          - name: work
            mountPath: /home/runner/_work

    volumes:
      - name: dind-storage
        emptyDir: {}
      - name: work
        emptyDir: {}
